name: Android
on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/build-mobile.py && git diff --exit-code -- android/app/src/main/assets
      - run: node tests/app.test.cjs && python3 -m unittest discover -s tests
      - run: npm ci --prefix mobile && cd mobile && npx playwright install --with-deps chromium
      - run: NODE_PATH="$PWD/mobile/node_modules" node tests/mobile.cjs
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            docs/android/*.png
