<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planning Austral · Materias y aulas</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;color:#d4ddd7;background:#0b0e0c;--muted:#86958b;--green:#9eeeab;--line:#28322c}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header,main{max-width:1000px;margin:auto;padding:0 24px}header{padding-top:40px;padding-bottom:24px;border-bottom:1px solid var(--line)}header small{font-size:12px;color:var(--muted)}h1{font-size:clamp(24px,5vw,36px);margin:12px 0 0;letter-spacing:-.06em;font-weight:500}h1 span{color:var(--green)}main{padding-top:24px}.panel{margin-bottom:20px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;flex:1;min-width:140px}input,select,button{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:#111713;color:#d4ddd7}input,select{min-width:0;width:100%}button{cursor:pointer}.tabs{display:flex;gap:0;margin:26px 0 20px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:12px 18px;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--green);border-bottom-color:var(--green)}#q{font-size:17px;width:100%;margin:10px 0}input::placeholder{color:#66756b}.hint,footer{font-size:11px;color:var(--muted);line-height:1.7}#status{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}#status:before{content:'● ';color:var(--green)}#status.loading:before{animation:pulse 1s infinite}#status.error{color:#edb792}#status.error:before{color:#edb792}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.card{background:#101512;border:1px solid var(--line);padding:18px;border-radius:4px;overflow-wrap:anywhere}.card:hover{border-color:#4d6a55}.card h3{margin:12px 0;font-size:16px;font-weight:500;color:#eef5f0;line-height:1.5}.badge{color:var(--green);font-size:11px}.card p{font-size:12px;line-height:1.7;margin:8px 0;color:#a4b2a9}.card a{color:var(--green);font-size:11px;text-decoration:none}details{margin-top:14px;font-size:11px;line-height:1.7;white-space:pre-wrap;color:var(--muted)}summary{cursor:pointer}footer{margin:28px 0;border-top:1px solid var(--line);padding-top:16px}.empty{padding:24px 0;color:var(--muted);font-size:12px}h2{font-size:12px;font-weight:400;color:var(--muted)}#count{margin:24px 0 14px}a{color:inherit}input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){#status.loading:before{animation:none}}@media(max-width:520px){header,main{padding-left:16px;padding-right:16px}header{padding-top:24px}.tabs button{flex:1;padding:12px 8px}#results{grid-template-columns:1fr}}
</style>
<header><small>AUSTRAL / PLANNING</small><h1><span>&gt;_</span> campus.lookup</h1></header><main>
<section class="panel"><div class="row"><label>Fecha<input id="date" type="date" required></label><label>Campus<select id="campus"><option>Pilar</option><option>Buenos Aires</option><option>Rosario</option><option value="">Todos</option></select></label></div><div id="status" role="status" aria-live="polite">Conectando con Planning…</div></section>
<div class="tabs" role="tablist" aria-label="Tipo de búsqueda"><button id="subjects" role="tab" aria-controls="subjectForm" aria-selected="true">01 / materias</button><button id="rooms" role="tab" aria-controls="roomForm" aria-selected="false">02 / aulas libres</button></div>
<section class="panel"><div id="subjectForm" role="tabpanel" aria-labelledby="subjects"><label for="q">Materia</label><input id="q" type="search" placeholder="analisis 2, álgebra, física…" autocomplete="off"><div class="hint">Tildes, mayúsculas y números romanos resueltos automáticamente.</div></div><div id="roomForm" role="tabpanel" aria-labelledby="rooms" hidden><div class="row"><label>Desde<input id="from" type="time" value="12:00" required></label><label>Hasta<input id="to" type="time" value="14:00" required></label><label>Edificio<select id="building"><option value="default">Olivo A/B · Roble · Ceibo</option><option value="all">Todas las aulas</option></select></label></div></div></section>
<h2 id="count">Cargando…</h2><div id="results" aria-live="polite"></div><footer><a href="https://planning-campus.austral.edu.ar:44443/" target="_blank" rel="noopener">planning.austral ↗</a> · UTC−3 · Actualización automática<br>Libre = sin reservas registradas; no garantiza que el aula esté vacía.</footer></main>
<script>
const BASE='https://planning-campus.austral.edu.ar:44443/';
const SESSION='__PLANNING_SESSION__';
let sessionStream;
function connectSession(){if(location.protocol==='file:')return;sessionStream=new EventSource('/api/session?token='+encodeURIComponent(SESSION));}
connectSession();
addEventListener('pagehide',()=>sessionStream?.close());
addEventListener('pageshow',e=>{if(e.persisted)connectSession();});
const $=id=>document.getElementById(id);let data=null,mode='subjects',loadedDate='',loadedCampus='',loadVersion=0,loadController=null,refreshTimer=null,lastLoadedAt=0;
$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(x|ix|viii|vii|vi|v|iv|iii|ii|i)\b/g,v=>({i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10}[v])).replace(/[^a-z0-9]+/g,' ').trim();
const tidy=s=>String(s).replace(/\s+/g,' ').trim();
function distance(a,b){let v=Array.from({length:b.length+1},(_,i)=>i);for(let i=0;i<a.length;i++){let n=[i+1];for(let j=0;j<b.length;j++)n[j+1]=Math.min(n[j]+1,v[j+1]+1,v[j]+(a[i]!==b[j]));v=n;}return v[b.length];}
function score(title,q){let ts=norm(title).split(' '),qs=norm(q).split(' ').filter(Boolean);if(!qs.length)return 1;let total=0;for(let w of qs){let best=Infinity;for(let t of ts){let s=w===t?0:(!/^\d+$/.test(w)&&t.startsWith(w)?0.2:(!/^\d+$/.test(w)&&w.length>=4?distance(w,t):Infinity));if(s<=Math.max(1,Math.floor(w.length*.22)))best=Math.min(best,s);}if(best===Infinity)return Infinity;total+=best;}return total;}
function csv(s){let rows=[],r=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){r.push(v);v='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))rows.push(r);r=[];v='';}else v+=c;}if(v||r.length){r.push(v);rows.push(r);}if(quoted)throw Error('CSV incompleto.');return rows;}
function stamp(s){let months=['january','february','march','april','may','june','july','august','september','october','november','december'];let m=s.match(/(\d{1,2})\s+(\w+)\s+(\d{4})\s+(\d{2}:\d{2}(?::\d{2})?)/);if(!m||months.indexOf(m[2].toLowerCase())<0)throw Error('Formato de fecha desconocido: '+s);return Date.parse(`${m[3]}-${String(months.indexOf(m[2].toLowerCase())+1).padStart(2,'0')}-${m[1].padStart(2,'0')}T${m[4]}-03:00`);}
async function read(path,signal){const url=location.protocol==='file:'?BASE+path:'/api/planning?path='+encodeURIComponent(path);let r=await fetch(url,{credentials:'omit',headers:location.protocol==='file:'?{}:{'X-Planning-Session':SESSION},cache:'no-store',signal:AbortSignal.any([signal,AbortSignal.timeout(45000)])});if(!r.ok)throw Error('Planning respondió '+r.status);return r.text();}
const doc=s=>new DOMParser().parseFromString(s,'text/html');
function parseBookings(s){const rows=csv(s),head=rows.shift()||[],cols=['Area - Room','Brief Description','Start Time - End Time','Full Description'].map(x=>head.indexOf(x));if(cols.slice(0,3).some(x=>x<0))throw Error('Planning no devolvió el reporte público esperado.');return rows.map(r=>{let times=(r[cols[2]]||'').split(' - ');if(times.length!==2)throw Error('Intervalo de reserva desconocido.');return {room:tidy(r[cols[0]]),title:r[cols[1]],start:stamp(times[0]),end:stamp(times[1]),description:cols[3]<0?'':r[cols[3]]};});}
function dateParams(date=$('date').value){let [year,month,day]=date.split('-');return new URLSearchParams({year,month,day});}
function link(room){let p=dateParams();p.set('area',room.area);p.set('room',room.id);return BASE+'week.php?'+p;}
function card(title,tag,lines,url,description){let el=document.createElement('article');el.className='card';let b=document.createElement('span');b.className='badge';b.textContent=tag;el.append(b);let h=document.createElement('h3');h.textContent=title;el.append(h);for(let line of lines){let p=document.createElement('p');p.textContent=line;el.append(p);}if(url){let a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='Ver en Planning ↗';el.append(a);}if(description){let d=document.createElement('details'),s=document.createElement('summary');s.textContent='Detalle de la reserva';d.append(s,document.createTextNode(description));el.append(d);}return el;}
const clock=t=>new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false}).format(t);
function render(){ $('results').replaceChildren();if(!data||loadedDate!==$('date').value||loadedCampus!==$('campus').value){$('count').textContent=$('date').value?'Cargando horarios…':'Elegí una fecha';return;}if(mode==='subjects'){let found=data.bookings.map(b=>({...b,score:score(b.title,$('q').value)})).filter(b=>isFinite(b.score)).sort((a,b)=>a.score-b.score||a.start-b.start);$('count').textContent=`${found.length} reservas encontradas`;for(let b of found){let room=data.rooms.find(r=>norm(r.full)===norm(b.room));$('results').append(card(b.title,`${clock(b.start)} — ${clock(b.end)}`,[b.room],room?link(room):BASE+'day.php?'+dateParams(),b.description));}}else{let start=Date.parse(loadedDate+'T'+$('from').value+':00-03:00'),end=Date.parse(loadedDate+'T'+$('to').value+':00-03:00');if(!isFinite(start)||!isFinite(end)||end<=start){$('count').textContent='Elegí un intervalo válido: la hora final debe ser posterior';return;}let rooms=data.rooms.filter(r=>{let a=norm(r.areaName),n=norm(r.name);return !/virtual|online|deportes|exterior/.test(a)&&!/oficina|deposito|laboratorio|sala|auditorio/.test(n)&&(/aula/.test(n)||/olivo/.test(a)&&/^[abc]\s*\d/.test(n))&&($('building').value==='all'||/olivo.*modulo [ab]\b|edificio roble|edificio ceibo/.test(a));});let free=[],unknown=0;for(let r of rooms){let bookings=data.bookings.filter(b=>norm(b.room)===norm(r.full));let areaBookings=data.bookings.filter(b=>norm(b.room).startsWith(norm(r.areaName)+' '));let unmatched=areaBookings.filter(b=>!data.rooms.some(x=>norm(x.full)===norm(b.room)));if(unmatched.some(b=>b.start<end&&b.end>start)){unknown++;continue;}if(!bookings.some(b=>b.start<end&&b.end>start)){let next=bookings.filter(b=>b.start>=end).sort((a,b)=>a.start-b.start)[0];free.push({r,next});}}$('count').textContent=`${free.length} aulas disponibles de ${rooms.length} aulas${unknown?' · '+unknown+' sin confirmar':''}`;for(let {r,next} of free){$('results').append(card(r.name,'Disponible según Planning',[r.areaName,`${$('from').value} — ${$('to').value}`,next?`Próxima reserva: ${clock(next.start)} · ${next.title}`:'Sin reservas posteriores en el día'],link(r)));}}if(!$('results').children.length){let p=document.createElement('p');p.className='empty';p.textContent='No encontramos resultados para esta búsqueda.';$('results').append(p);}}
function scheduleRefresh(delay=300000){clearTimeout(refreshTimer);if(location.protocol!=='file:')refreshTimer=setTimeout(()=>{if(document.visibilityState==='visible')load();else scheduleRefresh();},delay);}
async function load(){
  clearTimeout(refreshTimer);
  const version=++loadVersion;
  loadController?.abort();
  loadController=new AbortController();
  const signal=loadController.signal,date=$('date').value,campus=$('campus').value;
  data=null;render();
  if(!date){$('status').className='';$('status').textContent='Elegí una fecha';return;}
  $('status').className='loading';$('status').textContent='Sincronizando horarios…';
  try{
    let [year,month,day]=date.split('-');
    let p=new URLSearchParams({From_year:year,From_month:month,From_day:day,To_year:year,To_month:month,To_day:day,areamatch:campus,summarize:'5',sortby:'s',display:'e',sumby:'d'});
    let [raw,grid]=await Promise.all([read('report.php?'+p,signal),read('day.php?'+dateParams(date),signal)]);
    let bookings=parseBookings(raw),root=doc(grid);
    let areas=[...root.querySelectorAll('#dwm_areas option')].map(o=>({id:o.value,name:tidy(o.textContent)})).filter(a=>!campus||norm(a.name).includes(norm(campus)));
    if(!areas.length)throw Error('No se pudo leer el inventario de áreas para ese campus.');
    let rooms=[],partial=[];
    for(let i=0;i<areas.length;i+=4){
      if(signal.aborted)return;
      await Promise.all(areas.slice(i,i+4).map(async area=>{
        try{
          let p=dateParams(date);p.set('area',area.id);
          let d=doc(await read('day.php?'+p,signal));
          let links=[...d.querySelectorAll('thead a[href*="week.php"][href*="room="]')];
          if(!links.length)throw Error('Sin inventario');
          for(let a of links){
            let u=new URL(a.getAttribute('href'),BASE),name=tidy(a.textContent).replace(/\s*\(\d+\)\s*$/,'');
            rooms.push({id:u.searchParams.get('room'),area:area.id,areaName:area.name,name,full:tidy(area.name+' - '+name)});
          }
        }catch(e){if(signal.aborted)throw e;partial.push(area.name);}
      }));
    }
    if(version!==loadVersion||signal.aborted)return;
    data={bookings,rooms};loadedDate=date;loadedCampus=campus;lastLoadedAt=Date.now();
    $('status').className=partial.length?'error':'';
    $('status').textContent=`Sync ${clock(lastLoadedAt)} · ${bookings.length} reservas${partial.length?' · Inventario incompleto: '+partial.join(', '):''}`;
    render();scheduleRefresh(partial.length?30000:300000);
  }catch(e){
    if(version!==loadVersion||signal.aborted)return;
    $('status').className='error';
    $('status').textContent=location.protocol==='file:'?'Abrí la app con python3 server.py para conectar con Planning.':'Error de conexión. '+e.message+' Reintentando automáticamente…';
    $('count').textContent='Sin datos confirmados';scheduleRefresh(20000);
  }
}
for(let id of ['date','campus'])$(id).addEventListener('change',load);
for(let id of ['q','from','to','building'])$(id).addEventListener('input',render);
for(let tab of ['subjects','rooms'])$(tab).onclick=()=>{
  mode=tab;$('subjects').setAttribute('aria-selected',mode==='subjects');$('rooms').setAttribute('aria-selected',mode==='rooms');
  $('subjectForm').hidden=mode!=='subjects';$('roomForm').hidden=mode!=='rooms';render();
};
addEventListener('online',load);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastLoadedAt>=300000)load();});
load();
</script></html>
