<script>

let savedTheme = 'dark';

addEventListener('pagehide', () => { sessionStream?.close(); loadController?.abort(); clearTimeout(refreshTimer); });

$('date').value = relativeDate();

function score(title, query) {

function parseBookings(text) {

async function read(path, signal) {

    const [raw, grid] = await Promise.all([read('report.php?' + p, signal), read('day.php?' + dateParams(date), signal)]);

    const areas = [...root.querySelectorAll('#dwm_areas option')].map(o => ({id:o.value, name:tidy(o.textContent)}))
      .filter(a => !campus || norm(a.name).startsWith(norm(campus) + ' '));
    if (!areas.length) throw Error('No se pudo leer el inventario de áreas para ese campus.');
    const rooms = [], partial = [], seen = new Set();
    for (let i = 0; i < areas.length; i += 4) {
      if (signal.aborted) return;
      await Promise.all(areas.slice(i, i + 4).map(async area => {
        try {
          const p = dateParams(date); p.set('area', area.id);
          const d = doc(await read('day.php?' + p, signal));
          const links = [...d.querySelectorAll('thead a[href*="week.php"][href*="room="]')];
          if (!links.length) throw Error('Sin inventario');
          for (const a of links) {
            const u = new URL(a.getAttribute('href'), BASE), id = u.searchParams.get('room');
            if (u.searchParams.get('area') !== area.id || !id || seen.has(id)) continue;
            const name = tidy(a.textContent).replace(/\s*\(\d+\)\s*$/, '');
            rooms.push({id, area:area.id, areaName:area.name, name, full:tidy(area.name + ' - ' + name)}); seen.add(id);
          }
        } catch (e) {if (signal.aborted) throw e; partial.push(area.name);}
      }));
    }
    if (version !== loadVersion || signal.aborted) return;
    data = {bookings, rooms, date, key}; pendingKey = ''; lastLoadedAt = Date.now();
    $('status').className = partial.length ? 'error' : '';
    $('status').textContent = `Sync ${clock(lastLoadedAt)}${partial.length ? ' · Inventario incompleto: ' + partial.join(', ') : ''}`;
    render(); scheduleRefresh(partial.length ? 30000 : 300000);
  } catch (e) {
    if (version !== loadVersion || signal.aborted) return;
    data = null; pendingKey = ''; failedKey = key;
    $('status').className = 'error'; $('status').textContent = 'Error de conexión. ' + e.message + ' Reintentando automáticamente…';
    render(); scheduleRefresh(20000);
  }
}
for (const [id, days] of [['today',0], ['tomorrow',1]]) $(id).onclick = () => {$('date').value = relativeDate(days); syncEnd(); load();};
for (const id of ['date', 'campus']) $(id).addEventListener('change', () => {syncEnd(); $('building').disabled = $('campus').value !== 'Pilar'; if ($('building').disabled) $('building').value = 'all'; load();});
$('now').onclick = () => {$('date').value = relativeDate(); $('from').value = clock(Date.now()); updateRange();};
for (const id of ['from', 'hours']) $(id).addEventListener('input', updateRange);
$('to').addEventListener('input', () => {
  const start = minutes($('from').value), end = minutes($('to').value);
  let delta = end - start; if (delta < 0) delta += 1440;
  $('hours').value = Number.isFinite(delta) ? String(Math.round(delta / 60 * 1000000) / 1000000) : '';
  updateRange();
});
for (const id of ['q', 'building']) $(id).addEventListener('input', render);
function selectTab(tab) {
  mode = tab;
  for (const id of ['subjects', 'rooms']) {$(id).setAttribute('aria-selected', String(mode === id)); $(id).tabIndex = mode === id ? 0 : -1;}
  $('subjectForm').hidden = mode !== 'subjects'; $('roomForm').hidden = mode !== 'rooms'; render();
}
for (const tab of ['subjects', 'rooms']) {
  $(tab).onclick = () => selectTab(tab);
  $(tab).onkeydown = e => {
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    e.preventDefault(); const next = e.key === 'Home' ? 'subjects' : e.key === 'End' ? 'rooms' : mode === 'subjects' ? 'rooms' : 'subjects'; selectTab(next); $(next).focus();
  };
}
addEventListener('online', load);
document.addEventListener('visibilitychange', () => {if (document.visibilityState === 'visible' && !pendingKey && Date.now() - lastLoadedAt >= 300000) load();});
syncEnd(); load();
</script></html>
